<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" width="180" height="260">
  <!-- 墨色极夜：OLED 近纯黑夜空 + 冰蓝月牙 + 星点 + 山影与一线湖光 -->
  <defs>
    <linearGradient id="ink-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
  </defs>
  <rect width="180" height="260" fill="url(#ink-sky)"/>
  <!-- 星点 -->
  <g fill="#9db8d4">
    <circle cx="24" cy="34" r="1.4"/>
    <circle cx="58" cy="20" r="1"/>
    <circle cx="96" cy="42" r="1.2"/>
    <circle cx="150" cy="26" r="1.4"/>
    <circle cx="166" cy="64" r="1"/>
    <circle cx="36" cy="84" r="1"/>
    <circle cx="78" cy="70" r="0.9"/>
    <circle cx="118" cy="16" r="0.9"/>
  </g>
  <circle cx="134" cy="92" r="1.8" fill="#cfe2f5"/>
  <!-- 冰蓝月牙 -->
  <circle cx="64" cy="72" r="24" fill="#59a1d8"/>
  <circle cx="74" cy="64" r="22" fill="#0b0d11"/>
  <circle cx="64" cy="72" r="30" fill="#59a1d8" opacity="0.12"/>
  <!-- 山影两层 -->
  <path d="M0 176 L46 128 L84 168 L126 122 L180 172 V260 H0 Z" fill="#10141b"/>
  <path d="M0 204 L60 164 L110 200 L152 172 L180 196 V260 H0 Z" fill="#090b0f"/>
  <!-- 一线湖面反光 -->
  <rect x="46" y="236" width="88" height="2.5" rx="1.2" fill="#59a1d8" opacity="0.55"/>
  <rect x="70" y="244" width="40" height="1.8" rx="0.9" fill="#59a1d8" opacity="0.3"/>
</svg>
