<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canopy</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #7c3aed;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* 品牌紫渐变底 + 树冠光斑（与应用内启动屏一致，不依赖位图资产） */
      .backdrop { position: fixed; inset: 0; background: linear-gradient(135deg, #c3a8ff, #a07cf2 55%, #7c3aed); }
      .glow { position: fixed; border-radius: 50%; filter: blur(72px); }
      .glow-a { left: -96px; top: -96px; width: 320px; height: 320px; background: rgba(255,255,255,.10); }
      .glow-b { right: -10%; bottom: -20%; width: 384px; height: 384px; background: rgba(196,181,253,.25); }
      .watermark {
        position: fixed; right: -64px; top: 50%; height: 130%; transform: translateY(-50%);
        opacity: .14;
      }
      .content {
        position: relative; z-index: 1; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 32px; text-align: center;
      }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 300; letter-spacing: .04em; }
      .brand img { width: 36px; height: 36px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
      .slogan { max-width: 320px; margin: 24px 0 0; font-size: 17px; font-weight: 300; line-height: 1.5; letter-spacing: .04em; color: rgba(255,255,255,.95); }
      .progress { width: 96px; height: 1px; margin-top: 28px; overflow: hidden; background: rgba(255,255,255,.35); }
      .progress::after { content: ""; display: block; width: 40%; height: 100%; background: rgba(255,255,255,.9); animation: pulse 1.6s ease-in-out infinite; }
      .title { margin: 16px 0 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; }
      .tagline { position: absolute; bottom: 32px; margin: 0; font-size: 11px; letter-spacing: .3em; color: rgba(255,255,255,.65); }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; } }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <svg class="watermark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M44 16 A20 20 0 1 0 44 48" stroke="#fff" stroke-width="5" stroke-linecap="round" />
      <path d="M36 28 Q42 20 50 22" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
      <path d="M36 28 Q38 34 36 40" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    </svg>
    <main class="content" aria-busy="true" aria-live="polite">
      <div class="brand"><img src="canopy-mark-white.svg" alt="" />Canopy</div>
      <p class="slogan">让协作自然发生，让想法流动成形</p>
      <div class="progress"></div>
      <p class="title">正在启动 Canopy</p>
      <p class="tagline">LOCAL-FIRST AI AGENT</p>
    </main>
  </body>
</html>
